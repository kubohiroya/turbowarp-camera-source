name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # The identity npm exchanges for a short-lived publishing credential.
  id-token: write

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
        # No registry-url. It writes an .npmrc whose auth token is the literal
        # placeholder XXXXX-XXXXX-XXXXX-XXXXX when no token is supplied, and a
        # configured credential -- even a bogus one -- is what npm sends instead
        # of exchanging the workflow identity, so the publish is refused as
        # "OIDC permission denied". package.json already names the registry in
        # publishConfig, so nothing else needed this.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Check the tag names the version being released
        # The registry will not accept a replacement for a version already
        # published, so a tag that does not match package.json either publishes
        # something nobody asked for or fails after the release is already cut.
        # Version 0.7.0 exists because this went unnoticed once already.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not name package.json version $version." >&2
            exit 1
          fi
      - name: Create ZIP archive
        run: |
          cd dist
          zip ../turbowarp-camera-source.zip *.js
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.js
            turbowarp-camera-source.zip
      - name: Use an npm that can publish without a stored token
        # Trusted publishing needs npm 11.5.1 or newer. The pinned Node already
        # ships one, so this only keeps the requirement from depending on which
        # npm happens to come with a future bump.
        run: npm install -g npm@latest
      - name: Publish to npm
        # No token in this repository. npm checks this workflow's identity
        # against the package's trusted publisher on npmjs.com, and the
        # credential it issues lives for the length of the job. Provenance is
        # attached without asking.
        #
        # The half of the setting that is not in this file is on npmjs.com,
        # under the package's Settings -> Trusted publisher. Four fields have to
        # match, and one mismatch is a 403 "OIDC permission denied":
        #
        #   Organization or user  kubohiroya
        #   Repository            turbowarp-camera-source
        #   Workflow filename     release.yml   <- the filename alone; the path
        #                                         .github/workflows/release.yml
        #                                         does not match
        #   Environment           (empty)       <- this workflow declares no
        #                                         `environment:`, so a name here
        #                                         does not match
        #
        # Publishing access on the same page matters too: "Require two-factor
        # authentication" refuses OIDC, so it has to be "Require two-factor
        # authentication or an automation token".
        #
        # Accepting a publish and serving it are different things -- the version
        # took about 80 seconds to appear in the registry after a successful job
        # (#41), so a downstream update has to wait for the registry itself.
        # docs/trusted-publishing.ja.md has the wait, how to read whether
        # provenance was attached, and which other packages this is spreading to.
        #
        # Runs last, so a failed check or a mismatched tag stops the release
        # before anything reaches the registry, where it cannot be taken back.
        run: npm publish --access public

  finalize-published-tags:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install OIDC-capable npm
        run: npm install --global npm@11.21.0
      - name: Verify published artifact and synchronize release tags
        env:
          RELEASE_PACKAGE: '@kubohiroya/turbowarp-camera-source'
          RELEASE_VERSION: '0.20.0'
          RELEASE_SHA1: '9f4c5ff796af87cbb311b6d6b75de59771e3f38b'
        run: |
          set -eu
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const {RELEASE_PACKAGE: name, RELEASE_VERSION: version, RELEASE_SHA1: sha1} = process.env;
          const main = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          assert.equal(main.name, name, 'Unexpected package on main');
          assert.equal(main.version, version, 'Main has advanced');
          const npm = (...args) => execFileSync('npm', args, {encoding: 'utf8'});
          const published = JSON.parse(npm('view', `${name}@${version}`, '--json', '--prefer-online'));
          assert.equal(published.name, name);
          assert.equal(published.version, version);
          assert.equal(published.dist.shasum, sha1, 'Published artifact differs');
          const readTags = () => JSON.parse(npm('view', name, 'dist-tags', '--json', '--prefer-online'));
          const tags = readTags();
          for (const tag of ['latest', 'next']) {
            if (tags[tag] !== version) npm('dist-tag', 'add', `${name}@${version}`, tag);
          }
          let complete = false;
          for (let attempt = 0; attempt < 30; attempt += 1) {
            const actual = readTags();
            if (actual.latest === version && actual.next === version) {
              console.log(JSON.stringify({package: name, version, ...actual}));
              complete = true;
              break;
            }
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          assert(complete, 'Release tags have not converged');
          NODE
